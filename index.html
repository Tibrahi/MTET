<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Timetable Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #pdf-container.pdf-mode {
            width: 860px !important;
            max-width: 860px !important;
            padding: 55px 48px !important;
            margin: 0 auto !important;
            box-shadow: none !important;
            overflow: visible !important;
            background: white !important;
        }
        
        .pdf-mode .schedule-table {
            width: 100% !important;
            table-layout: fixed !important;
            border-collapse: collapse !important;
        }
        
        .pdf-mode .schedule-table th,
        .pdf-mode .schedule-table td {
            padding: 19px 15px !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
        }
        
        /* Column widths - perfect balance */
        .pdf-mode .schedule-table col:nth-child(1) { width: 14%; } /* Day */
        .pdf-mode .schedule-table col:nth-child(2) { width: 15%; } /* Date */
        .pdf-mode .schedule-table col:nth-child(3) { width: 14%; } /* Time */
        .pdf-mode .schedule-table col:nth-child(4) { width: 32%; } /* Course */
        .pdf-mode .schedule-table col:nth-child(5) { width: 13%; } /* Group */
        .pdf-mode .schedule-table col:nth-child(6) { width: 12%; } /* Status */
        
        .status-done { text-decoration: line-through; color: #16a34a; }
        .status-redo { color: #ea580c; font-weight: 600; }
        .status-pending { color: #64748b; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Editable Title -->
        <div class="text-center">
            <div id="mainTitle" onclick="editTitle(this)" 
                 class="inline-block text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 cursor-pointer hover:underline">
                Exam Timetable Dashboard
            </div>
            <p class="text-gray-500 text-sm mt-1">Click title to edit • Saved automatically</p>
        </div>

        <!-- Exam Type Selector -->
        <div class="flex justify-center">
            <div class="bg-white rounded-3xl shadow px-8 py-3 flex items-center gap-4">
                <span class="font-semibold text-gray-600">Exam Type:</span>
                <select id="examType" onchange="saveExamType()" 
                        class="bg-transparent font-medium text-lg px-4 py-2 rounded-2xl border border-gray-200 focus:border-purple-500 outline-none">
                    <option value="Mid Semester Exam">Mid Semester Exam</option>
                    <option value="Final Exam">Final Exam</option>
                </select>
            </div>
        </div>

        <div class="bg-white/80 backdrop-blur-md shadow-xl rounded-3xl p-8">
            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Day Name</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Date</label>
                    <input type="date" id="date" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Time (clock picker)</label>
                    <input type="time" id="hour" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Course / Subject</label>
                    <input type="text" id="course" placeholder="e.g., Applied Mathematics" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Group / Room</label>
                    <input type="text" id="groupName" placeholder="e.g., Group G • Room 205" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 transition-all">
                        Add to Timetable →
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-end gap-3">
            <button onclick="clearAllData()" 
                class="bg-red-100 hover:bg-red-200 text-red-700 font-medium py-2.5 px-6 rounded-2xl transition-all">
                Clear All Data
            </button>
            <button onclick="downloadPDF()" 
                class="bg-gray-900 hover:bg-black text-white font-semibold py-3 px-8 rounded-2xl shadow flex items-center gap-2 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 0v4m0 0l-4-4m4 4l-4 4" />
                </svg>
                Download Perfect PDF
            </button>
        </div>

        <div class="bg-white shadow-2xl rounded-3xl overflow-hidden">
            <div id="pdf-container" class="bg-white p-10">
                <div class="text-center mb-10 pb-8 border-b border-gray-100">
                    <h2 id="pdfHeader" class="text-3xl font-bold text-gray-800">Your Exam Schedule</h2>
                    <p class="text-sm text-gray-500 mt-2">User-editable • Mid/Final Exam Timetable</p>
                </div>
                
                <table id="scheduleTable" class="schedule-table w-full border border-gray-100 rounded-2xl overflow-hidden">
                    <colgroup>
                        <col><col><col><col><col><col>
                    </colgroup>
                    <thead>
                        <tr class="bg-gradient-to-r from-indigo-50 to-purple-50 text-xs font-bold text-indigo-900 uppercase tracking-widest">
                            <th class="text-left px-6 py-5">Day</th>
                            <th class="text-left px-6 py-5">Date</th>
                            <th class="text-left px-6 py-5">Time</th>
                            <th class="text-left px-6 py-5">Course / Subject</th>
                            <th class="text-left px-6 py-5">Group / Room</th>
                            <th class="text-left px-6 py-5">Status</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardBody" class="divide-y divide-gray-100 text-sm">
                    </tbody>
                </table>

                <div id="emptyState" class="text-center py-20 text-gray-400">
                    <p class="text-lg">No exams added yet</p>
                    <p class="text-sm mt-1">Fill the form above</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Clean readable time
        function formatTime(timeStr) {
            if (!timeStr || !timeStr.includes(':')) return timeStr || '—';
            const [hStr, min] = timeStr.split(':');
            let h = parseInt(hStr, 10);
            if (isNaN(h)) return timeStr;
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `\( {h}: \){min} ${ampm}`;
        }

        // Nice date
        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // Status classes
        function getStatusHTML(status) {
            if (status === 'Done') return `<span class="status-done inline-block bg-green-100 text-green-700 px-4 py-1 rounded-full text-xs font-bold">DONE ✓</span>`;
            if (status === 'Redo') return `<span class="status-redo inline-block bg-orange-100 text-orange-700 px-4 py-1 rounded-full text-xs font-bold">REDO !</span>`;
            return `<span class="status-pending inline-block bg-slate-100 text-slate-700 px-4 py-1 rounded-full text-xs font-bold">PENDING</span>`;
        }

        let db;
        const dbName = "ExamTimetableDB";
        const request = indexedDB.open(dbName, 2);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("exams")) {
                db.createObjectStore("exams", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("config")) {
                const store = db.createObjectStore("config", { keyPath: "id" });
                store.put({ id: "settings", timetableTitle: "Your Exam Schedule", examType: "Mid Semester Exam" });
            }
        };

        request.onsuccess = function() {
            db = request.result;
            loadConfig();
            loadDashboard();
        };

        // Load & apply saved config
        function loadConfig() {
            db.transaction(["config"], "readonly").objectStore("config").get("settings").onsuccess = function(e) {
                const settings = e.target.result || { timetableTitle: "Your Exam Schedule", examType: "Mid Semester Exam" };
                document.getElementById("mainTitle").textContent = settings.timetableTitle;
                document.getElementById("pdfHeader").textContent = settings.timetableTitle;
                document.getElementById("examType").value = settings.examType;
            };
        }

        function saveConfig(title, examType) {
            const tx = db.transaction(["config"], "readwrite");
            tx.objectStore("config").put({ id: "settings", timetableTitle: title, examType: examType });
        }

        // Make title editable
        function editTitle(el) {
            const current = el.textContent.trim();
            const input = document.createElement("input");
            input.value = current;
            input.className = "text-4xl font-extrabold text-center bg-white border-2 border-purple-400 rounded-2xl px-6 py-2 outline-none w-full max-w-md mx-auto";
            el.replaceWith(input);
            input.focus();
            input.select();

            function save() {
                let newTitle = input.value.trim();
                if (!newTitle) newTitle = "Your Exam Schedule";
                const newEl = document.createElement("div");
                newEl.id = "mainTitle";
                newEl.onclick = () => editTitle(newEl);
                newEl.className = "inline-block text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 cursor-pointer hover:underline";
                newEl.textContent = newTitle;
                input.replaceWith(newEl);

                const examType = document.getElementById("examType").value;
                saveConfig(newTitle, examType);
                document.getElementById("pdfHeader").textContent = newTitle;
            }

            input.onblur = save;
            input.onkeydown = (e) => { if (e.key === "Enter") save(); };
        }

        function saveExamType() {
            const titleEl = document.getElementById("mainTitle");
            const newType = document.getElementById("examType").value;
            const currentTitle = titleEl.textContent.trim();
            saveConfig(currentTitle, newType);
            document.getElementById("pdfHeader").textContent = currentTitle;
        }

        // Form submit
        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                day: document.getElementById('day').value.trim(),
                date: document.getElementById('date').value,
                time: formatTime(document.getElementById('hour').value),
                course: document.getElementById('course').value.trim(),
                group: document.getElementById('groupName').value.trim(),
                status: "Pending"
            };

            db.transaction(["exams"], "readwrite")
              .objectStore("exams")
              .add(newItem)
              .onsuccess = () => {
                  document.getElementById('scheduleForm').reset();
                  loadDashboard();
              };
        });

        function loadDashboard() {
            const tbody = document.getElementById('dashboardBody');
            const empty = document.getElementById('emptyState');
            const table = document.getElementById('scheduleTable');

            db.transaction(["exams"], "readonly")
              .objectStore("exams")
              .getAll()
              .onsuccess = function(e) {
                const data = e.target.result || [];
                tbody.innerHTML = '';

                if (data.length === 0) {
                    empty.style.display = 'block';
                    table.style.display = 'none';
                    return;
                }

                empty.style.display = 'none';
                table.style.display = 'table';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-5 font-semibold text-indigo-700">${item.day}</td>
                        <td class="px-6 py-5 font-medium text-gray-700">${formatDate(item.date)}</td>
                        <td class="px-6 py-5 font-medium text-gray-700">${item.time}</td>
                        <td class="px-6 py-5 font-semibold text-gray-800">${item.course}</td>
                        <td class="px-6 py-5 font-medium text-gray-700">${item.group}</td>
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-2">
                                ${getStatusHTML(item.status)}
                                <select onchange="updateStatus(${item.id}, this.value)" 
                                        class="text-xs bg-white border border-gray-300 rounded-lg px-2 py-1">
                                    <option value="Pending" ${item.status==='Pending'?'selected':''}>Pending</option>
                                    <option value="Done" ${item.status==='Done'?'selected':''}>Done</option>
                                    <option value="Redo" ${item.status==='Redo'?'selected':''}>Redo</option>
                                </select>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            };
        }

        function updateStatus(id, newStatus) {
            const tx = db.transaction(["exams"], "readwrite");
            const store = tx.objectStore("exams");
            store.get(id).onsuccess = function(e) {
                const item = e.target.result;
                if (item) {
                    item.status = newStatus;
                    store.put(item);
                    loadDashboard();
                }
            };
        }

        function clearAllData() {
            if (!confirm("Clear ALL data and reset to defaults?")) return;
            
            const tx = db.transaction(["exams", "config"], "readwrite");
            tx.objectStore("exams").clear();
            tx.objectStore("config").put({ 
                id: "settings", 
                timetableTitle: "Your Exam Schedule", 
                examType: "Mid Semester Exam" 
            });
            
            tx.oncomplete = () => {
                document.getElementById("mainTitle").textContent = "Your Exam Schedule";
                document.getElementById("pdfHeader").textContent = "Your Exam Schedule";
                document.getElementById("examType").value = "Mid Semester Exam";
                loadDashboard();
            };
        }

        function downloadPDF() {
            let filename = prompt("PDF filename:", "Exam-Timetable");
            if (filename === null || filename.trim() === "") filename = "Exam-Timetable";

            const element = document.getElementById('pdf-container');
            element.classList.add('pdf-mode');

            const opt = {
                margin: [22, 22, 22, 22],
                filename: `${filename}.pdf`,
                image: { type: 'jpeg', quality: 0.99 },
                html2canvas: { 
                    scale: 3.5, 
                    useCORS: true,
                    width: 860,
                    scrollX: 0,
                    scrollY: 0,
                    backgroundColor: '#ffffff'
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('pdf-mode');
            });
        }
    </script>
</body>
</html>
