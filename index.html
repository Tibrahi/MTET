<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Class Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- PDF SUPER-FIX - 100% unsquished, fully visible table -->
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* LOCKS perfect A4 - no scroll, no left cutoff */
        #pdf-container.pdf-mode {
            width: 840px !important;
            max-width: 840px !important;
            padding: 50px 45px !important;
            margin: 0 auto !important;
            box-shadow: none !important;
            overflow: visible !important;
            background: white !important;
        }
        
        .pdf-mode .schedule-table {
            width: 100% !important;
            table-layout: fixed !important;
            border-collapse: collapse !important;
        }
        
        .pdf-mode .schedule-table th,
        .pdf-mode .schedule-table td {
            padding: 18px 14px !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
            vertical-align: middle !important;
        }
        
        /* Perfect column balance - Course gets most space */
        .pdf-mode .schedule-table col:nth-child(1) { width: 15%; } /* Day */
        .pdf-mode .schedule-table col:nth-child(2) { width: 16%; } /* Date */
        .pdf-mode .schedule-table col:nth-child(3) { width: 15%; } /* Time */
        .pdf-mode .schedule-table col:nth-child(4) { width: 37%; } /* Course */
        .pdf-mode .schedule-table col:nth-child(5) { width: 17%; } /* Group */
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-down': 'fadeInDown 0.6s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'bounce-slight': 'bounceSlight 2s infinite',
                    },
                    keyframes: {
                        fadeInDown: { '0%': { opacity: '0', transform: 'translateY(-20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        bounceSlight: { '0%, 100%': { transform: 'translateY(-5%)' }, '50%': { transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <div class="text-center animate-fade-in-down">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mb-2 drop-shadow-sm">
                Course Dashboard
            </h1>
            <p class="text-gray-500">Calendar + Real Clock Picker • Time shows exactly as you selected</p>
        </div>

        <div class="bg-white/80 backdrop-blur-md shadow-xl rounded-2xl p-6 md:p-8 animate-fade-in-down transition-all duration-300 hover:shadow-2xl">
            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Day Name</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all outline-none">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Date</label>
                    <input type="date" id="date" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all outline-none">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Time (clock picker)</label>
                    <input type="time" id="hour" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all outline-none">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Course</label>
                    <input type="text" id="course" placeholder="e.g., Advanced Mathematics" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all outline-none">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Group</label>
                    <input type="text" id="groupName" placeholder="e.g., Group A" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all outline-none">
                </div>

                <div class="flex items-end">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 transition-all">
                        Add to Schedule ✦
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-end">
            <button onclick="downloadPDF()" 
                class="bg-gray-800 text-white font-semibold py-2.5 px-7 rounded-full shadow-md hover:bg-black transform hover:-translate-y-1 transition-all flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Perfect PDF
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden">
            <div id="pdf-container" class="bg-white p-8 md:p-10">
                
                <div class="text-center mb-10 pb-6 border-b-2 border-indigo-100">
                    <h2 class="text-3xl font-bold text-gray-800">Your Class Schedule</h2>
                    <p class="text-sm text-gray-500 mt-2">Time shown exactly as you picked from the clock</p>
                </div>
                
                <div class="table-wrapper">
                    <table id="scheduleTable" class="schedule-table w-full border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                        <colgroup>
                            <col>
                            <col>
                            <col>
                            <col>
                            <col>
                        </colgroup>
                        <thead>
                            <tr class="bg-gradient-to-r from-indigo-50 to-purple-50 text-sm font-bold text-indigo-900 uppercase tracking-wider">
                                <th class="text-left px-6 py-5 border-b">Day</th>
                                <th class="text-left px-6 py-5 border-b">Date</th>
                                <th class="text-left px-6 py-5 border-b">Time</th>
                                <th class="text-left px-6 py-5 border-b">Course</th>
                                <th class="text-left px-6 py-5 border-b">Group</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardBody" class="divide-y divide-gray-100 bg-white text-sm">
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" class="text-center py-20 text-gray-400">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    <p class="text-lg font-medium">No classes yet</p>
                    <p class="text-sm">Pick date & time from calendar/clock above</p>
                </div>

            </div>
        </div>

    </div>

    <script>
        // FIXED: Time now renders EXACTLY as you selected from the clock (12h AM/PM format)
        function formatTime(timeStr) {
            if (!timeStr) return '';
            let [hoursStr, minutes] = timeStr.split(':');
            let hours = parseInt(hoursStr, 10);           // Fixed: parseInt to avoid any string bug
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `\( {hours}: \){minutes} ${ampm}`;
        }

        let db;
        const request = indexedDB.open("ScheduleDashboardDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("schedules")) {
                db.createObjectStore("schedules", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            loadDashboard();
        };

        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                day: document.getElementById('day').value.trim(),
                date: document.getElementById('date').value,           // Calendar date
                time: formatTime(document.getElementById('hour').value), // FIXED: now always matches your clock selection
                course: document.getElementById('course').value.trim(),
                group: document.getElementById('groupName').value.trim()
            };

            const tx = db.transaction(["schedules"], "readwrite");
            tx.objectStore("schedules").add(newItem).onsuccess = () => {
                document.getElementById('scheduleForm').reset();
                loadDashboard();
            };
        });

        function loadDashboard() {
            const tbody = document.getElementById('dashboardBody');
            const empty = document.getElementById('emptyState');
            const table = document.getElementById('scheduleTable');

            const tx = db.transaction(["schedules"], "readonly");
            tx.objectStore("schedules").getAll().onsuccess = function(e) {
                const data = e.target.result;
                tbody.innerHTML = '';

                if (data.length === 0) {
                    empty.style.display = 'block';
                    table.style.display = 'none';
                } else {
                    empty.style.display = 'none';
                    table.style.display = 'table';

                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50 transition-colors';
                        tr.innerHTML = `
                            <td class="px-6 py-5 font-semibold text-indigo-700">${item.day}</td>
                            <td class="px-6 py-5 font-medium text-gray-700">${item.date}</td>
                            <td class="px-6 py-5 font-medium text-gray-700">${item.time}</td>
                            <td class="px-6 py-5 font-semibold text-gray-800">${item.course}</td>
                            <td class="px-6 py-5">
                                <span class="bg-purple-100 text-purple-700 text-xs font-bold px-4 py-2 rounded-full border border-purple-200 shadow-sm">
                                    ${item.group}
                                </span>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            };
        }

        function downloadPDF() {
            let filename = prompt("PDF filename:", "My-Class-Schedule");
            if (filename === null) return;
            if (!filename.trim()) filename = "Class-Schedule";

            const element = document.getElementById('pdf-container');
            element.classList.add('pdf-mode');

            const opt = {
                margin: [18, 18, 18, 18],
                filename: `${filename}.pdf`,
                image: { type: 'jpeg', quality: 0.99 },
                html2canvas: { 
                    scale: 3.5, 
                    useCORS: true,
                    width: 840,
                    scrollX: 0,
                    scrollY: 0,
                    backgroundColor: '#ffffff'
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('pdf-mode');
            });
        }
    </script>
</body>
</html>
