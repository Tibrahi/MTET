<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- PERFECT PDF FIX - no squishing, full visibility -->
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #pdf-container.pdf-mode {
            width: 840px !important;
            max-width: 840px !important;
            padding: 50px 45px !important;
            margin: 0 auto !important;
            box-shadow: none !important;
            overflow: visible !important;
            background: white !important;
        }
        
        .pdf-mode .schedule-table {
            width: 100% !important;
            table-layout: fixed !important;
            border-collapse: collapse !important;
        }
        
        .pdf-mode .schedule-table th,
        .pdf-mode .schedule-table td {
            padding: 18px 14px !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
        }
        
        /* Balanced columns - Course gets most space */
        .pdf-mode .schedule-table col:nth-child(1) { width: 15%; }
        .pdf-mode .schedule-table col:nth-child(2) { width: 16%; }
        .pdf-mode .schedule-table col:nth-child(3) { width: 15%; }
        .pdf-mode .schedule-table col:nth-child(4) { width: 37%; }
        .pdf-mode .schedule-table col:nth-child(5) { width: 17%; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">
                Course Dashboard
            </h1>
            <p class="text-gray-500">Calendar + Clock Picker • Time & Date shown in normal readable format</p>
        </div>

        <div class="bg-white/80 backdrop-blur-md shadow-xl rounded-3xl p-8">
            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Day Name</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Date</label>
                    <input type="date" id="date" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Time (clock picker)</label>
                    <input type="time" id="hour" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Course</label>
                    <input type="text" id="course" placeholder="e.g., Applied Mathematics" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Group</label>
                    <input type="text" id="groupName" placeholder="e.g., Group G" required
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 transition-all">
                        Add to Schedule →
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-end">
            <button onclick="downloadPDF()" 
                class="bg-gray-900 hover:bg-black text-white font-semibold py-3 px-8 rounded-2xl shadow flex items-center gap-2 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 0v4m0 0l-4-4m4 4l-4 4" />
                </svg>
                Download Perfect PDF
            </button>
        </div>

        <div class="bg-white shadow-2xl rounded-3xl overflow-hidden">
            <div id="pdf-container" class="bg-white p-10">
                <div class="text-center mb-8 pb-6 border-b border-gray-100">
                    <h2 class="text-3xl font-bold text-gray-800">Your Class Schedule</h2>
                    <p class="text-sm text-gray-500 mt-1">All times & dates shown in normal readable language</p>
                </div>
                
                <table id="scheduleTable" class="schedule-table w-full border border-gray-100 rounded-2xl overflow-hidden">
                    <colgroup>
                        <col><col><col><col><col>
                    </colgroup>
                    <thead>
                        <tr class="bg-gradient-to-r from-indigo-50 to-purple-50 text-xs font-bold text-indigo-900 uppercase tracking-widest">
                            <th class="text-left px-6 py-5">Day</th>
                            <th class="text-left px-6 py-5">Date</th>
                            <th class="text-left px-6 py-5">Time</th>
                            <th class="text-left px-6 py-5">Course</th>
                            <th class="text-left px-6 py-5">Group</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardBody" class="divide-y divide-gray-100 text-sm">
                    </tbody>
                </table>

                <div id="emptyState" class="text-center py-20 text-gray-400">
                    <p class="text-lg">No classes added yet</p>
                    <p class="text-sm mt-1">Pick date & time from calendar/clock above</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // FIXED: Bulletproof readable time (always shows "3:20 PM", never code format)
        function formatTime(timeStr) {
            if (!timeStr || !timeStr.includes(':')) return timeStr || '—';
            
            let [hoursStr, minutes] = timeStr.split(':');
            let hours = parseInt(hoursStr, 10);
            
            if (isNaN(hours)) return timeStr;
            
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;   // 0 becomes 12
            
            return `\( {hours}: \){minutes} ${ampm}`;
        }

        // Nice readable date (20 Mar 2026 instead of 2026-03-20)
        function formatDate(isoDate) {
            if (!isoDate) return '';
            const date = new Date(isoDate);
            if (isNaN(date.getTime())) return isoDate;
            
            return date.toLocaleDateString('en-GB', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }

        let db;
        const request = indexedDB.open("ScheduleDashboardDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("schedules")) {
                db.createObjectStore("schedules", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function() {
            db = request.result;
            loadDashboard();
        };

        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                day: document.getElementById('day').value.trim(),
                date: document.getElementById('date').value,           // stored as YYYY-MM-DD
                time: formatTime(document.getElementById('hour').value), // saved already formatted
                course: document.getElementById('course').value.trim(),
                group: document.getElementById('groupName').value.trim()
            };

            db.transaction(["schedules"], "readwrite")
              .objectStore("schedules")
              .add(newItem)
              .onsuccess = () => {
                  document.getElementById('scheduleForm').reset();
                  loadDashboard();
              };
        });

        function loadDashboard() {
            const tbody = document.getElementById('dashboardBody');
            const empty = document.getElementById('emptyState');
            const table = document.getElementById('scheduleTable');

            db.transaction(["schedules"], "readonly")
              .objectStore("schedules")
              .getAll()
              .onsuccess = function(e) {
                const data = e.target.result;
                tbody.innerHTML = '';

                if (data.length === 0) {
                    empty.style.display = 'block';
                    table.style.display = 'none';
                } else {
                    empty.style.display = 'none';
                    table.style.display = 'table';

                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50 transition-colors';
                        tr.innerHTML = `
                            <td class="px-6 py-5 font-semibold text-indigo-700">${item.day}</td>
                            <td class="px-6 py-5 font-medium text-gray-700">${formatDate(item.date)}</td>
                            <td class="px-6 py-5 font-medium text-gray-700">${item.time}</td>
                            <td class="px-6 py-5 font-semibold text-gray-800">${item.course}</td>
                            <td class="px-6 py-5">
                                <span class="inline-block bg-purple-100 text-purple-700 text-xs font-bold px-4 py-1.5 rounded-full border border-purple-200">
                                    ${item.group}
                                </span>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            };
        }

        function downloadPDF() {
            let filename = prompt("PDF filename:", "My-Class-Schedule");
            if (filename === null || filename.trim() === "") filename = "Class-Schedule";

            const element = document.getElementById('pdf-container');
            element.classList.add('pdf-mode');

            const opt = {
                margin: [20, 20, 20, 20],
                filename: `${filename}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 3.5, 
                    useCORS: true,
                    width: 840,
                    scrollX: 0,
                    scrollY: 0,
                    backgroundColor: '#ffffff'
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('pdf-mode');
            });
        }
    </script>
</body>
</html>
