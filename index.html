<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Class Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-down': 'fadeInDown 0.6s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'bounce-slight': 'bounceSlight 2s infinite',
                    },
                    keyframes: {
                        fadeInDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <div class="text-center animate-fade-in-down">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mb-2 drop-shadow-sm">
                Course Dashboard
            </h1>
            <p class="text-gray-500">Manage your schedule with style</p>
        </div>

        <div id="setupView" class="bg-white/80 backdrop-blur-md shadow-xl rounded-2xl p-6 md:p-10 animate-fade-in-down max-w-md mx-auto text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome!</h2>
            <p class="text-gray-500 mb-6">Let's set up your course schedule.</p>
            
            <label class="block text-sm font-semibold text-gray-600 mb-2">How many courses will you take?</label>
            <input type="number" id="courseLimit" min="1" placeholder="e.g., 6" 
                class="w-full text-center px-4 py-3 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none mb-6 text-lg font-bold">
            
            <button onclick="startCourseEntry()" 
                class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 active:scale-95 transition-all duration-300">
                Start Adding Courses ✦
            </button>
        </div>

        <div id="formView" class="hidden bg-white/80 backdrop-blur-md shadow-xl rounded-2xl p-6 md:p-8 animate-fade-in-down transition-all duration-300">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-gray-800">Add Course Information</h2>
                <span id="progressIndicator" class="bg-purple-100 text-purple-700 py-1 px-4 rounded-full text-sm font-bold shadow-sm">
                    Course 1 of X
                </span>
            </div>

            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Day Name</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Date (DD-MMM)</label>
                    <input type="text" id="date" placeholder="e.g., 25-Oct" required pattern="\d{1,2}-[a-zA-Z]{3}" title="Format: DD-MMM (e.g., 25-Oct)"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Time (AM/PM)</label>
                    <input type="time" id="hour" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Course</label>
                    <input type="text" id="course" placeholder="e.g., Mathematics" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Group</label>
                    <input type="text" id="groupName" placeholder="e.g., Group A" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="flex items-end md:col-span-1">
                    <button type="submit" title="Create"
                        class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-2 px-6 rounded-xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 hover:scale-[1.02] active:scale-95 transition-all duration-300 flex justify-center items-center text-3xl pb-3">
                        +
                    </button>
                </div>
            </form>
        </div>

        <div id="dashboardView" class="hidden space-y-8">
            <div class="flex justify-end animate-fade-in-down" style="animation-delay: 0.2s;">
                <button onclick="downloadPDF()" 
                    class="bg-gray-800 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-black transform hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center gap-2">
                    <svg class="w-5 h-5 animate-bounce-slight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download PDF
                </button>
            </div>

            <div id="pdf-container" class="bg-white shadow-xl rounded-2xl p-6 md:p-8 min-h-[300px]">
                <div class="mb-6 border-b pb-4 flex flex-col md:flex-row md:justify-between md:items-end gap-2">
                    <h2 class="text-2xl font-bold text-gray-800">Your Schedule</h2>
                    <p id="timestampDisplay" class="text-sm font-medium text-purple-600 bg-purple-50 px-3 py-1 rounded-lg inline-block"></p>
                </div>
                
                <div class="hidden md:grid grid-cols-5 gap-4 text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 px-4">
                    <div>Day</div>
                    <div>Date</div>
                    <div>Time</div>
                    <div>Course</div>
                    <div>Group</div>
                </div>

                <div id="dashboardList" class="space-y-3">
                </div>
                
                <div id="emptyState" class="text-center py-10 text-gray-400">
                    <p>No classes added yet.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        let targetCourseCount = 0;
        let tempCourses = [];

        // 1. Setup view logic
        function startCourseEntry() {
            const limitInput = document.getElementById('courseLimit').value;
            if (!limitInput || limitInput < 1) {
                alert("Please enter a valid number of courses.");
                return;
            }
            
            targetCourseCount = parseInt(limitInput);
            tempCourses = [];
            
            // Switch views
            document.getElementById('setupView').classList.add('hidden');
            document.getElementById('formView').classList.remove('hidden');
            
            updateProgress();
        }

        // 2. Update progress starting from 1
        function updateProgress() {
            let currentNumber = tempCourses.length + 1;
            // Cap the visual number so it doesn't exceed the limit for the split second before the dashboard loads
            if (currentNumber > targetCourseCount) currentNumber = targetCourseCount; 
            
            document.getElementById('progressIndicator').innerText = `Course ${currentNumber} of ${targetCourseCount}`;
        }

        // 3. Format time
        function formatAMPM(timeStr) {
            let [hours, minutes] = timeStr.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return `${hours}:${minutes} ${ampm}`;
        }

        // 4. Set up IndexedDB
        let db;
        const request = indexedDB.open("ScheduleDashboardDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("schedules")) {
                db.createObjectStore("schedules", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
        };

        request.onerror = function(event) {
            console.error("IndexedDB Error: ", event.target.errorCode);
        };

        // 5. Handle Form Submit
        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let rawDate = document.getElementById('date').value;
            let dateParts = rawDate.split('-');
            let formattedDate = dateParts[0] + '-' + dateParts[1].charAt(0).toUpperCase() + dateParts[1].slice(1).toLowerCase();

            const newItem = {
                day: document.getElementById('day').value,
                date: formattedDate,
                time: formatAMPM(document.getElementById('hour').value),
                course: document.getElementById('course').value,
                group: document.getElementById('groupName').value
            };

            tempCourses.push(newItem);
            document.getElementById('scheduleForm').reset();
            updateProgress();

            // Automatically switch when limit is hit
            if (tempCourses.length >= targetCourseCount) {
                saveAllAndShowDashboard();
            }
        });

        // 6. Save data, generate timestamp, and display dashboard
        function saveAllAndShowDashboard() {
            // Generate Timestamp
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString();
            document.getElementById('timestampDisplay').innerText = `Generated on ${dateString} at ${timeString}`;

            const transaction = db.transaction(["schedules"], "readwrite");
            const store = transaction.objectStore("schedules");
            
            let addedCount = 0;

            tempCourses.forEach(item => {
                const addRequest = store.add(item);
                addRequest.onsuccess = function() {
                    addedCount++;
                    if (addedCount === tempCourses.length) {
                        document.getElementById('formView').classList.add('hidden');
                        document.getElementById('dashboardView').classList.remove('hidden');
                        loadDashboard();
                    }
                };
            });
            
            tempCourses = [];
        }

        // 7. Load Data & Render Rows
        function loadDashboard() {
            const listContainer = document.getElementById('dashboardList');
            const emptyState = document.getElementById('emptyState');
            
            const transaction = db.transaction(["schedules"], "readonly");
            const store = transaction.objectStore("schedules");
            const getRequest = store.getAll();

            getRequest.onsuccess = function() {
                const data = getRequest.result;
                listContainer.innerHTML = ''; 
                
                if (data.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                    
                    data.forEach((item, index) => {
                        const delay = index * 0.1; 
                        
                        const row = document.createElement('div');
                        row.className = `animate-slide-up bg-gray-50 hover:bg-purple-50 border border-gray-100 rounded-xl p-4 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md`;
                        row.style.animationDelay = `${delay}s`;
                        
                        row.innerHTML = `
                            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                                <div class="font-semibold text-indigo-600"><span class="md:hidden text-gray-400 font-normal text-sm">Day: </span>${item.day}</div>
                                <div class="text-gray-700"><span class="md:hidden text-gray-400 font-normal text-sm">Date: </span>${item.date}</div>
                                <div class="text-gray-700"><span class="md:hidden text-gray-400 font-normal text-sm">Time: </span>${item.time}</div>
                                <div class="font-medium text-gray-800"><span class="md:hidden text-gray-400 font-normal text-sm">Course: </span>${item.course}</div>
                                <div><span class="bg-purple-100 text-purple-700 py-1 px-3 rounded-full text-sm font-bold">${item.group}</span></div>
                            </div>
                        `;
                        listContainer.appendChild(row);
                    });
                }
            };
        }

        // 8. PDF Generation (includes prompt & timestamp)
        function downloadPDF() {
            let filename = prompt("Enter a name for your PDF file:", "My-Schedule");
            
            if (filename === null) return; 
            if (filename.trim() === "") filename = "Course-Dashboard"; 
            
            const element = document.getElementById('pdf-container');
            
            const opt = {
                margin:       0.5,
                filename:     `${filename}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 }, 
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
