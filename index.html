<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Class Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ensures the table looks perfect on the screen and the PDF */
        .pdf-table-width {
            min-width: 900px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 font-sans">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="text-center animate-fade-in">
            <h1 class="text-4xl font-black text-slate-800 tracking-tight">COURSE SCHEDULE SYSTEM</h1>
            <p class="text-slate-500 mt-2 font-medium">Enter data below to generate your full-page PDF</p>
        </div>

        <div class="bg-white shadow-2xl rounded-3xl p-8 border border-slate-100">
            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Day</label>
                    <input type="text" id="day" placeholder="Monday" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Date</label>
                    <input type="text" id="date" placeholder="DD-MM" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Time</label>
                    <input type="time" id="hour" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Course Name</label>
                    <input type="text" id="course" placeholder="Enter Course Name" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Group</label>
                    <input type="text" id="groupName" placeholder="Group A" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95">
                        ADD DATA TO LIST
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-between items-center px-2">
            <h3 class="text-xl font-bold text-slate-700">Preview Area</h3>
            <button onclick="downloadPDF()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-emerald-100 flex items-center gap-2 transition-all">
                <span>Download Full Page PDF</span>
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-x-auto border border-slate-200">
            <div id="pdf-container" class="bg-white p-12">
                
                <div class="flex justify-between items-end mb-10 border-b-4 border-indigo-600 pb-6">
                    <div>
                        <h2 class="text-4xl font-black text-slate-800 uppercase tracking-tighter">Class Schedule</h2>
                        <p class="text-indigo-600 font-bold tracking-widest text-sm uppercase">Official Record</p>
                    </div>
                    <div class="text-right text-slate-400 text-xs font-mono">
                        Generated: <span id="currentDate"></span>
                    </div>
                </div>

                <div class="pdf-table-width">
                    <div class="grid grid-cols-5 bg-slate-800 text-white rounded-t-lg overflow-hidden">
                        <div class="p-4 font-bold text-sm uppercase">Day</div>
                        <div class="p-4 font-bold text-sm uppercase">Date</div>
                        <div class="p-4 font-bold text-sm uppercase">Time</div>
                        <div class="p-4 font-bold text-sm uppercase">Course Name</div>
                        <div class="p-4 font-bold text-sm uppercase text-right">Group</div>
                    </div>

                    <div id="dashboardList" class="border-x border-b border-slate-200 divide-y divide-slate-100 rounded-b-lg">
                        </div>
                </div>

                <div id="emptyState" class="text-center py-20 text-slate-300">
                    <p class="text-lg italic">The schedule is currently empty. Please add data.</p>
                </div>

                <div class="mt-12 pt-6 border-t border-slate-100 text-center">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">End of Document</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

        function formatAMPM(timeStr) {
            let [hours, minutes] = timeStr.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        let db;
        const request = indexedDB.open("ProScheduleDB", 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("schedules", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = e => { db = e.target.result; loadDashboard(); };

        document.getElementById('scheduleForm').onsubmit = function(e) {
            e.preventDefault();
            const newItem = {
                day: document.getElementById('day').value,
                date: document.getElementById('date').value,
                time: formatAMPM(document.getElementById('hour').value),
                course: document.getElementById('course').value,
                group: document.getElementById('groupName').value
            };
            const transaction = db.transaction(["schedules"], "readwrite");
            transaction.objectStore("schedules").add(newItem).onsuccess = () => {
                this.reset();
                loadDashboard();
            };
        };

        function loadDashboard() {
            const list = document.getElementById('dashboardList');
            const empty = document.getElementById('emptyState');
            const transaction = db.transaction(["schedules"], "readonly");
            transaction.objectStore("schedules").getAll().onsuccess = e => {
                const data = e.target.result;
                list.innerHTML = '';
                if (data.length === 0) {
                    empty.style.display = 'block';
                    list.parentElement.classList.add('hidden');
                } else {
                    empty.style.display = 'none';
                    list.parentElement.classList.remove('hidden');
                    data.forEach(item => {
                        const row = document.createElement('div');
                        row.className = "grid grid-cols-5 items-center hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0";
                        row.innerHTML = `
                            <div class="p-4 font-bold text-slate-700">${item.day}</div>
                            <div class="p-4 text-slate-600">${item.date}</div>
                            <div class="p-4 text-slate-600 font-medium">${item.time}</div>
                            <div class="p-4 font-bold text-indigo-700">${item.course}</div>
                            <div class="p-4 text-right"><span class="bg-slate-100 px-3 py-1 rounded text-xs font-black text-slate-600 border border-slate-200">${item.group}</span></div>
                        `;
                        list.appendChild(row);
                    });
                }
            };
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-container');
            const opt = {
                margin:       [0.3, 0.3, 0.3, 0.3], // Small margins for full page use
                filename:     'Complete-Schedule.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { 
                    scale: 3, // Very high resolution
                    useCORS: true,
                    windowWidth: 1200 // Forces the computer to see the "Full" version of the page
                },
                jsPDF:        { 
                    unit: 'in', 
                    format: 'a4', 
                    orientation: 'landscape' // Best for 5-column wide layouts
                }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
