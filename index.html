<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Class Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-down': 'fadeInDown 0.6s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'bounce-slight': 'bounceSlight 2s infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <div class="text-center animate-fade-in-down">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mb-2 drop-shadow-sm">
                Course Dashboard
            </h1>
            <p class="text-gray-500" id="courseTracker">Manage your schedule with style</p>
        </div>

        <div id="addBtnSpace" class="flex justify-center hidden animate-fade-in-down">
            <button id="addCourseBtn" class="bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-full w-16 h-16 text-3xl font-light shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center animate-pulse-slow">
                +
            </button>
        </div>

        <div id="formContainer" class="hidden bg-white/80 backdrop-blur-md shadow-xl rounded-2xl p-6 md:p-8 animate-slide-up transition-all duration-300">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-gray-700">Add New Course</h3>
                <button id="closeFormBtn" class="text-gray-400 hover:text-red-500 transition-colors">✕</button>
            </div>
            
            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Day Name</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Date</label>
                    <input type="date" id="date" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1 text-gray-600">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Time</label>
                    <input type="time" id="hour" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1 text-gray-600">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Course</label>
                    <input type="text" id="course" placeholder="e.g., Mathematics" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Group</label>
                    <input type="text" id="groupName" placeholder="e.g., Group A" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="flex items-end md:col-span-1">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 hover:scale-[1.02] active:scale-95 transition-all duration-300">
                        Save Course ✦
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-end animate-fade-in-down" style="animation-delay: 0.2s;">
            <button onclick="downloadPDF()" 
                class="bg-gray-800 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-black transform hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center gap-2">
                <svg class="w-5 h-5 animate-bounce-slight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download PDF
            </button>
        </div>

        <div id="pdf-container" class="bg-white shadow-xl rounded-2xl p-6 md:p-8 min-h-[300px]">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Your Schedule</h2>
            
            <div class="hidden md:grid grid-cols-5 gap-4 text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 px-4">
                <div>Day</div>
                <div>Date</div>
                <div>Time</div>
                <div>Course</div>
                <div>Group</div>
            </div>

            <div id="dashboardList" class="space-y-3">
                </div>
            
            <div id="emptyState" class="text-center py-10 text-gray-400">
                <p>No classes added yet. Click the + button above to start!</p>
            </div>
        </div>

    </div>

    <script>
        // Set up target limit (uses sessionStorage so it asks again if you close and reopen the tab)
        let targetCourses = parseInt(sessionStorage.getItem('courseLimit')) || 0;

        // 1. Format 24hr time to AM/PM easily
        function formatAMPM(timeStr) {
            let [hours, minutes] = timeStr.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return `${hours}:${minutes} ${ampm}`;
        }

        // 2. Format Date to "DD-Mon" (e.g. 25-Oct)
        function formatDate(dateStr) {
            if (!dateStr) return '';
            // Split to avoid timezone shifting issues
            const [year, month, day] = dateStr.split('-');
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${day}-${monthNames[parseInt(month) - 1]}`;
        }

        // 3. Set up IndexedDB
        let db;
        const request = indexedDB.open("ScheduleDashboardDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("schedules")) {
                db.createObjectStore("schedules", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            loadDashboard(); // Load data when DB is ready
        };

        request.onerror = function(event) {
            console.error("IndexedDB Error: ", event.target.errorCode);
        };

        // 4. UI Toggle logic
        const addBtnSpace = document.getElementById('addBtnSpace');
        const formContainer = document.getElementById('formContainer');
        const courseTracker = document.getElementById('courseTracker');

        document.getElementById('addCourseBtn').addEventListener('click', () => {
            addBtnSpace.classList.add('hidden');
            formContainer.classList.remove('hidden');
        });

        document.getElementById('closeFormBtn').addEventListener('click', (e) => {
            e.preventDefault();
            formContainer.classList.add('hidden');
            addBtnSpace.classList.remove('hidden');
        });

        // 5. Handle Form Submit
        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                day: document.getElementById('day').value,
                date: formatDate(document.getElementById('date').value),
                time: formatAMPM(document.getElementById('hour').value),
                course: document.getElementById('course').value,
                group: document.getElementById('groupName').value
            };

            const transaction = db.transaction(["schedules"], "readwrite");
            const store = transaction.objectStore("schedules");
            
            const addRequest = store.add(newItem);

            addRequest.onsuccess = function() {
                document.getElementById('scheduleForm').reset();
                formContainer.classList.add('hidden'); // hide form after saving
                loadDashboard(); // Refresh the list
            };
        });

        // 6. Load Data & Render Rows
        function loadDashboard() {
            const listContainer = document.getElementById('dashboardList');
            const emptyState = document.getElementById('emptyState');
            
            const transaction = db.transaction(["schedules"], "readonly");
            const store = transaction.objectStore("schedules");
            const getRequest = store.getAll();

            getRequest.onsuccess = function() {
                const data = getRequest.result;
                const currentCount = data.length;
                
                // Prompt user for their limit if we don't know it yet and DB is empty
                if (!targetCourses && currentCount === 0) {
                    let userInput = prompt("How many courses will you take this semester?", "2");
                    targetCourses = parseInt(userInput) || 1; // Default to 1 if they type gibberish
                    sessionStorage.setItem('courseLimit', targetCourses);
                }

                // Manage Visibility of the '+' button
                if (currentCount < targetCourses) {
                    addBtnSpace.classList.remove('hidden');
                    courseTracker.innerText = `Course ${currentCount} of ${targetCourses} added`;
                } else {
                    addBtnSpace.classList.add('hidden');
                    formContainer.classList.add('hidden'); // Ensure form is hidden if limit reached
                    courseTracker.innerText = `All ${targetCourses} courses added!`;
                }

                listContainer.innerHTML = ''; // Clear list
                
                if (currentCount === 0) {
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                    
                    data.forEach((item, index) => {
                        const delay = index * 0.1;
                        
                        const row = document.createElement('div');
                        row.className = `animate-slide-up bg-gray-50 hover:bg-purple-50 border border-gray-100 rounded-xl p-4 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md`;
                        row.style.animationDelay = `${delay}s`;
                        
                        row.innerHTML = `
                            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                                <div class="font-semibold text-indigo-600"><span class="md:hidden text-gray-400 font-normal text-sm">Day: </span>${item.day}</div>
                                <div class="text-gray-700"><span class="md:hidden text-gray-400 font-normal text-sm">Date: </span>${item.date}</div>
                                <div class="text-gray-700"><span class="md:hidden text-gray-400 font-normal text-sm">Time: </span>${item.time}</div>
                                <div class="font-medium text-gray-800"><span class="md:hidden text-gray-400 font-normal text-sm">Course: </span>${item.course}</div>
                                <div><span class="bg-purple-100 text-purple-700 py-1 px-3 rounded-full text-sm font-bold">${item.group}</span></div>
                            </div>
                        `;
                        listContainer.appendChild(row);
                    });
                }
            };
        }

        // 7. PDF Generation Logic
        function downloadPDF() {
            let filename = prompt("Enter a name for your PDF file:", "My-Schedule");
            
            if (filename === null) return;
            if (filename.trim() === "") filename = "Dashboard";
            
            const element = document.getElementById('pdf-container');
            
            const opt = {
                margin:       0.5,
                filename:     `${filename}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
