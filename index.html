<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Class Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-down': 'fadeInDown 0.6s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'bounce-slight': 'bounceSlight 2s infinite',
                    },
                    keyframes: {
                        fadeInDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <div class="text-center animate-fade-in-down">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 mb-2 drop-shadow-sm">
                Course Dashboard
            </h1>
            <p class="text-gray-500">Manage your schedule with style</p>
        </div>

        <div class="bg-white/80 backdrop-blur-md shadow-xl rounded-2xl p-6 md:p-8 animate-fade-in-down transition-all duration-300 hover:shadow-2xl">
            <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Day Name</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Date (DD-MM)</label>
                    <input type="text" id="date" placeholder="e.g., 25-10" required pattern="\d{2}-\d{2}" title="Format: DD-MM"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Time (AM/PM)</label>
                    <input type="time" id="hour" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Course</label>
                    <input type="text" id="course" placeholder="e.g., Mathematics" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="group">
                    <label class="block text-sm font-semibold text-gray-600 mb-1 group-focus-within:text-purple-500 transition-colors">Group</label>
                    <input type="text" id="groupName" placeholder="e.g., Group A" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all duration-300 outline-none transform focus:-translate-y-1">
                </div>

                <div class="flex items-end md:col-span-1">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 hover:scale-[1.02] active:scale-95 transition-all duration-300">
                        Add to Dashboard ✦
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-end gap-3 animate-fade-in-down" style="animation-delay: 0.2s;">
            <button onclick="editPDFContent()" 
                class="bg-indigo-600 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-indigo-700 transform hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Edit PDF Header
            </button>
            <button onclick="downloadPDF()" 
                class="bg-gray-800 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-black transform hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center gap-2">
                <svg class="w-5 h-5 animate-bounce-slight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download PDF
            </button>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 animate-fade-in-down">
                <h3 class="text-2xl font-bold text-gray-800 mb-6">Edit PDF Header Content</h3>
                
                <div class="space-y-4">
                    <div class="group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2 group-focus-within:text-indigo-500 transition-colors">Main Title</label>
                        <input type="text" id="pdfTitle" placeholder="e.g., Your Class Schedule"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all duration-300 outline-none text-lg font-semibold">
                    </div>

                    <div class="group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2 group-focus-within:text-indigo-500 transition-colors">Subtitle</label>
                        <input type="text" id="pdfSubtitle" placeholder="e.g., Generated dynamically via Course Dashboard"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all duration-300 outline-none">
                    </div>

                    <div class="group">
                        <label class="block text-sm font-semibold text-gray-600 mb-2 group-focus-within:text-indigo-500 transition-colors">Additional Info (Optional)</label>
                        <textarea id="pdfAdditionalInfo" placeholder="e.g., Academic Year 2024-2025"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all duration-300 outline-none resize-none" rows="3"></textarea>
                    </div>
                </div>

                <div class="flex gap-3 mt-8">
                    <button onclick="savePDFContent()" 
                        class="flex-1 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-purple-500/50 transform hover:-translate-y-1 active:scale-95 transition-all duration-300">
                        Save Changes
                    </button>
                    <button onclick="closeEditModal()" 
                        class="flex-1 bg-gray-200 text-gray-800 font-bold py-3 px-6 rounded-xl hover:bg-gray-300 transform active:scale-95 transition-all duration-300">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden">
            <div id="pdf-container" class="bg-white p-8">
                
                <div class="text-center mb-6 pb-4 border-b-2 border-indigo-200">
                    <h2 id="pdf-header-title" class="text-2xl font-bold text-gray-800">Your Class Schedule</h2>
                    <p id="pdf-header-subtitle" class="text-xs text-gray-600 mt-2">Generated dynamically via Course Dashboard</p>
                    <p id="pdf-header-additional" class="text-xs text-gray-500 mt-1"></p>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse rounded-lg border border-gray-300 overflow-hidden shadow-sm">
                        
                        <thead>
                            <tr class="bg-gradient-to-r from-indigo-100 to-purple-100 border-b-2 border-gray-300">
                                <th class="border border-gray-300 text-left font-extrabold text-indigo-900 uppercase tracking-wider px-4 py-3">Day</th>
                                <th class="border border-gray-300 text-left font-extrabold text-indigo-900 uppercase tracking-wider px-4 py-3">Date</th>
                                <th class="border border-gray-300 text-left font-extrabold text-indigo-900 uppercase tracking-wider px-4 py-3">Time</th>
                                <th class="border border-gray-300 text-left font-extrabold text-indigo-900 uppercase tracking-wider px-4 py-3">Course</th>
                                <th class="border border-gray-300 text-left font-extrabold text-indigo-900 uppercase tracking-wider px-4 py-3">Group</th>
                            </tr>
                        </thead>

                        <tbody id="dashboardList" class="divide-y divide-gray-200 bg-white">
                        </tbody>
                        
                    </table>
                </div>

                <div id="emptyState" class="text-center py-12 text-gray-400">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    <p class="text-lg">No classes added yet.</p>
                    <p class="text-sm">Fill out the form above to build your schedule.</p>
                </div>

            </div>
        </div>

    </div>

    <script>
        // 1. Format 24hr time to AM/PM easily
        function formatAMPM(timeStr) {
            let [hours, minutes] = timeStr.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return `${hours}:${minutes} ${ampm}`;
        }

        // PDF Header Configuration
        let pdfConfig = {
            title: 'Your Class Schedule',
            subtitle: 'Generated dynamically via Course Dashboard',
            additionalInfo: ''
        };

        // Load PDF config from localStorage on page load
        function loadPDFConfig() {
            const saved = localStorage.getItem('pdfConfig');
            if (saved) {
                pdfConfig = JSON.parse(saved);
                updatePDFHeader();
            }
        }

        // Update PDF header display
        function updatePDFHeader() {
            document.getElementById('pdf-header-title').textContent = pdfConfig.title;
            document.getElementById('pdf-header-subtitle').textContent = pdfConfig.subtitle;
            const additionalEl = document.getElementById('pdf-header-additional');
            if (pdfConfig.additionalInfo) {
                additionalEl.textContent = pdfConfig.additionalInfo;
                additionalEl.style.display = 'block';
            } else {
                additionalEl.style.display = 'none';
            }
        }

        // Open edit modal
        function editPDFContent() {
            document.getElementById('pdfTitle').value = pdfConfig.title;
            document.getElementById('pdfSubtitle').value = pdfConfig.subtitle;
            document.getElementById('pdfAdditionalInfo').value = pdfConfig.additionalInfo;
            document.getElementById('editModal').classList.remove('hidden');
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // Save PDF content changes
        function savePDFContent() {
            pdfConfig.title = document.getElementById('pdfTitle').value.trim() || 'Your Class Schedule';
            pdfConfig.subtitle = document.getElementById('pdfSubtitle').value.trim() || 'Generated dynamically via Course Dashboard';
            pdfConfig.additionalInfo = document.getElementById('pdfAdditionalInfo').value.trim();
            
            // Save to localStorage
            localStorage.setItem('pdfConfig', JSON.stringify(pdfConfig));
            
            // Update display
            updatePDFHeader();
            
            // Close modal
            closeEditModal();
            
            // Show success feedback
            alert('PDF header updated successfully!');
        }

        // Close modal when clicking outside
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('editModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeEditModal();
                    }
                });
            }
            
            // Load PDF config on page load
            loadPDFConfig();
        });

        // 2. Set up IndexedDB
        let db;
        const request = indexedDB.open("ScheduleDashboardDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("schedules")) {
                db.createObjectStore("schedules", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            loadDashboard(); 
        };

        request.onerror = function(event) {
            console.error("IndexedDB Error: ", event.target.errorCode);
        };

        // 3. Handle Form Submit
        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                day: document.getElementById('day').value,
                date: document.getElementById('date').value,
                time: formatAMPM(document.getElementById('hour').value),
                course: document.getElementById('course').value,
                group: document.getElementById('groupName').value
            };

            const transaction = db.transaction(["schedules"], "readwrite");
            const store = transaction.objectStore("schedules");
            
            const addRequest = store.add(newItem);

            addRequest.onsuccess = function() {
                document.getElementById('scheduleForm').reset();
                loadDashboard(); 
            };
        });

        // 4. Load Data & Render Rows
        function loadDashboard() {
            const listContainer = document.getElementById('dashboardList');
            const emptyState = document.getElementById('emptyState');
            
            const transaction = db.transaction(["schedules"], "readonly");
            const store = transaction.objectStore("schedules");
            const getRequest = store.getAll();

            getRequest.onsuccess = function() {
                const data = getRequest.result;
                listContainer.innerHTML = ''; 
                
                if (data.length === 0) {
                    emptyState.style.display = 'block';
                    listContainer.parentElement.parentElement.style.display = 'none'; // Hide table if empty
                } else {
                    emptyState.style.display = 'none';
                    listContainer.parentElement.parentElement.style.display = 'block'; // Show table
                    
                    data.forEach((item) => {
                        const row = document.createElement('tr');
                        row.className = `hover:bg-gray-50 transition-colors`;
                        
                        row.innerHTML = `
                            <td class="border border-gray-300 font-semibold text-indigo-600 px-4 py-3">${item.day}</td>
                            <td class="border border-gray-300 text-gray-700 px-4 py-3">${item.date}</td>
                            <td class="border border-gray-300 text-gray-700 px-4 py-3">${item.time}</td>
                            <td class="border border-gray-300 font-semibold text-gray-800 px-4 py-3">${item.course}</td>
                            <td class="border border-gray-300 px-4 py-3">
                                <span class="bg-purple-100 text-purple-700 py-1 px-2 rounded text-xs font-bold uppercase tracking-wide border border-purple-300">
                                    ${item.group}
                                </span>
                            </td>
                        `;
                        listContainer.appendChild(row);
                    });
                }
            };
        }

        // 5. PDF Generation Logic - Proper A4 page fitting
        function downloadPDF() {
            let filename = prompt("Enter a name for your PDF file:", "My-Schedule");
            
            if (filename === null) return; 
            if (filename.trim() === "") filename = "Class-Schedule"; 
            
            const element = document.getElementById('pdf-container');
            
            // Create a clone for PDF to avoid modifying the original
            const clonedElement = element.cloneNode(true);
            clonedElement.style.width = '210mm'; // A4 width
            clonedElement.style.padding = '10mm';
            clonedElement.style.boxSizing = 'border-box';
            clonedElement.style.margin = '0';
            
            // Hide the cloned element (append to body temporarily)
            clonedElement.style.position = 'absolute';
            clonedElement.style.left = '-9999px';
            document.body.appendChild(clonedElement);
            
            // Generate canvas from the cloned element
            html2canvas(clonedElement, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                windowWidth: 1000,
                windowHeight: 1400
            }).then(canvas => {
                // Remove cloned element
                document.body.removeChild(clonedElement);
                
                // Get canvas dimensions
                const imgData = canvas.toDataURL('image/png');
                
                // A4 dimensions in mm
                const pdfWidth = 210;  // A4 width in mm
                const pdfHeight = 297; // A4 height in mm
                const margin = 10;     // 10mm margins
                const contentWidth = pdfWidth - (2 * margin);
                const contentHeight = pdfHeight - (2 * margin);
                
                // Create PDF
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });
                
                // Calculate image dimensions to fit perfectly on page
                const canvasHeight = canvas.height;
                const canvasWidth = canvas.width;
                const ratio = canvasWidth / canvasHeight;
                
                let imgWidth = contentWidth;
                let imgHeight = imgWidth / ratio;
                
                // If image is too tall, scale it down
                if (imgHeight > contentHeight) {
                    imgHeight = contentHeight;
                    imgWidth = imgHeight * ratio;
                }
                
                // Center the image horizontally if needed
                const xOffset = margin + (contentWidth - imgWidth) / 2;
                const yOffset = margin;
                
                // Add image to PDF
                pdf.addImage(imgData, 'PNG', xOffset, yOffset, imgWidth, imgHeight);
                
                // Set document properties
                pdf.setProperties({
                    title: pdfConfig.title,
                    subject: 'Class Schedule',
                    author: 'Course Dashboard',
                    keywords: 'schedule, timetable',
                    creator: 'Course Dashboard Application'
                });
                
                // Save the PDF
                pdf.save(`${filename}.pdf`);
                
            }).catch(error => {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF. Please try again.');
            });
        }
    </script>
</body>
</html>
